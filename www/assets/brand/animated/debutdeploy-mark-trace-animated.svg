<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<style>
  /* dasharray 24 comfortably exceeds the longest trace (~12 units), so one
     value draws every path without needing per-path pathLength. */
  @keyframes dd-draw {
    0%, 6%    { stroke-dashoffset: 24; }
    38%, 88%  { stroke-dashoffset: 0; }
    100%      { stroke-dashoffset: 24; }
  }
  @keyframes dd-pop {
    0%, 30%   { transform: scale(0); opacity: 0; }
    46%, 88%  { transform: scale(1); opacity: 1; }
    100%      { transform: scale(0); opacity: 0; }
  }
  .tr { stroke-dasharray: 24; animation: dd-draw 4.6s ease-in-out infinite; }
  .dt { transform-box: fill-box; transform-origin: center;
        animation: dd-pop 4.6s ease-in-out infinite; }

  .t0, .d0 { animation-delay: 0s; }
  .t1, .d1 { animation-delay: .09s; }
  .t2, .d2 { animation-delay: .18s; }
  .t3, .d3 { animation-delay: .27s; }
  .t4, .d4 { animation-delay: .36s; }
  .t5, .d5 { animation-delay: .45s; }
  .t6, .d6 { animation-delay: .54s; }
  .t7, .d7 { animation-delay: .63s; }

  @media (prefers-reduced-motion: reduce) {
    .tr { animation: none; stroke-dashoffset: 0; }
    .dt { animation: none; transform: none; opacity: 1; }
  }
</style>
