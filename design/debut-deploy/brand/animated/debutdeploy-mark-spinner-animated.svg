<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -8 80 80" width="80" height="80">
<style>
  /* The scale lives inside the keyframes: a CSS transform replaces the
     presentation attribute wholesale, so rotating alone would drop it. With
     transform-box:fill-box the shape scales about its own centre and the
     old translate(-4.4,-4.4) recentring is no longer needed. */
  @keyframes dd-spin {
    from { transform: scale(1.16) rotate(0deg); }
    to   { transform: scale(1.16) rotate(360deg); }
  }
  .sp {
    stroke-dasharray: 26 132;
    transform-box: fill-box; transform-origin: center;
    animation: dd-spin 1.15s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) { .sp { animation-duration: 3.4s; } }
</style>
