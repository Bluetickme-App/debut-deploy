    - generic [ref=e912]:
      - generic [ref=e913]:
        - heading "Security and reliability built into the platform." [level=2] [ref=e914]
        - paragraph [ref=e915]: DebutDeploy applies platform-level controls across networking, secrets, backups, access and service monitoring. Security controls are designed around industry-standard practices; we publish certifications only once they are genuinely held.
      - generic [ref=e916]:
        - article [ref=e917]:
          - heading "Workload isolation" [level=3] [ref=e918]
          - paragraph [ref=e919]: Every application and database runs in its own fully isolated container with clean resource boundaries. Dedicated plans do not co-tenant CPU.
        - article [ref=e920]:
          - heading "Secret management" [level=3] [ref=e921]
          - paragraph [ref=e922]: Environment secrets are encrypted at rest and become write-only after saving. Our upstream infrastructure credentials never reach your browser or your repository.
        - article [ref=e923]:
          - heading "Encryption" [level=3] [ref=e924]
          - paragraph [ref=e925]: All traffic is served over HTTPS with certificates issued automatically via Traefik. There are no plaintext endpoints.
        - article [ref=e926]:
          - heading "Backups" [level=3] [ref=e927]
          - paragraph [ref=e928]: Managed Postgres is backed up nightly with 7-day retention. Platform configuration is backed up on the same schedule.
        - article [ref=e929]:
          - heading "Access and tokens" [level=3] [ref=e930]
          - paragraph [ref=e931]: Sign in with GitHub or Google. API tokens are scoped read-only or full, revocable, with per-resource ownership checks.
        - article [ref=e932]:
          - heading "Least-privilege deploys" [level=3] [ref=e933]
          - paragraph [ref=e934]: Repository access uses a single read-only deploy key, requesting only the GitHub scopes needed to build and deploy.
        - article [ref=e935]:
          - heading "Monitoring and incidents" [level=3] [ref=e936]
          - paragraph [ref=e937]: Service health is checked continuously and incidents are published to the status page as they are investigated.
        - article [ref=e938]:
          - heading "Data location" [level=3] [ref=e939]
          - paragraph [ref=e940]: Compute and storage run in data centres in Germany and Finland, inside the EU. No customer data is processed outside the region without notice.
